<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#0d1117"/>
  <!-- Mesh network: interconnected nodes -->
  <circle cx="16" cy="8" r="2" fill="#58a6ff"/>
  <circle cx="8" cy="16" r="2" fill="#58a6ff"/>
  <circle cx="24" cy="16" r="2" fill="#58a6ff"/>
  <circle cx="10" cy="24" r="2" fill="#58a6ff"/>
  <circle cx="22" cy="24" r="2" fill="#58a6ff"/>
  <circle cx="16" cy="16" r="2.5" fill="#3fb950"/>
  <!-- Lines connecting nodes -->
  <line x1="16" y1="8" x2="8" y2="16" stroke="#58a6ff" stroke-width="1" opacity="0.5"/>
  <line x1="16" y1="8" x2="24" y2="16" stroke="#58a6ff" stroke-width="1" opacity="0.5"/>
  <line x1="8" y1="16" x2="10" y2="24" stroke="#58a6ff" stroke-width="1" opacity="0.5"/>
  <line x1="24" y1="16" x2="22" y2="24" stroke="#58a6ff" stroke-width="1" opacity="0.5"/>
  <line x1="16" y1="16" x2="16" y2="8" stroke="#58a6ff" stroke-width="1" opacity="0.7"/>
  <line x1="16" y1="16" x2="8" y2="16" stroke="#58a6ff" stroke-width="1" opacity="0.7"/>
  <line x1="16" y1="16" x2="24" y2="16" stroke="#58a6ff" stroke-width="1" opacity="0.7"/>
  <line x1="16" y1="16" x2="10" y2="24" stroke="#58a6ff" stroke-width="1" opacity="0.7"/>
  <line x1="16" y1="16" x2="22" y2="24" stroke="#58a6ff" stroke-width="1" opacity="0.7"/>
  <line x1="10" y1="24" x2="22" y2="24" stroke="#58a6ff" stroke-width="1" opacity="0.5"/>
</svg>
