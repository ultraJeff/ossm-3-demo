apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# North-south gateway for the AI model endpoints: the Gateway, its
# ReferenceGrant to the cert-manager secret in istio-system, the
# HTTPRoutes, the passthrough OpenShift Routes, and the TLS Certificate.
#
# Deployed on its own by the ai-models-gateway ArgoCD Application in
# openshift-bootstrap-gitops. The Certificate is issued by the mesh CA in
# deploy/base/mesh/mesh-ca.yaml (service-mesh app).
resources:
  - ai-models-gateway.yaml
  - httproutes.yaml
  - ocp-routes.yaml
  - gateway-tls-cert.yaml
